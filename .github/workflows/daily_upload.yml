name: TrendPulse Daily Upload

on:
  schedule:
    # Trending days (Mon/Wed/Fri/Sun) → 7 AM UTC
#    - cron: "0 7 * * 0,1,3,5"
    # Educational days (Tue/Thu/Sat) → 6 PM UTC
#    - cron: "0 18 * * 2,4,6"
  workflow_dispatch:        # manual trigger from GitHub UI

permissions:
  contents: write           # needed to commit history.json back

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-liberation --fix-missing

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Write credentials
        run: |
          echo '${{ secrets.CLIENT_SECRETS }}' > client_secrets.json
          echo '${{ secrets.YOUTUBE_TOKEN }}' > token.json
          if [ -n "${{ secrets.YOUTUBE_COOKIES }}" ]; then
            echo '${{ secrets.YOUTUBE_COOKIES }}' > yt_cookies.txt
          fi

      - name: Write .env
        run: |
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}" >> .env
          echo "USE_EXTERNAL_IMAGES=false" >> .env

      - name: Run TrendPulse pipeline
        run: python main.py

      - name: Commit dashboard history
        run: |
          git config user.name "TrendPulse Bot"
          git config user.email "yashwanthan00@gmail.com"
          git add docs/history.json docs/shorts_used.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "📊 Update dashboard history [$(date +'%Y-%m-%d')]"
          git push

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_number }}
          path: logs/
