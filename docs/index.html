<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrendPulse Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d0d1a;
      color: #e2e8f0;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, #1a1a3e 0%, #0f0f2e 100%);
      border-bottom: 1px solid #2d2d5e;
      padding: 24px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .logo h1 {
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(135deg, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo p { font-size: 13px; color: #64748b; margin-top: 2px; }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #052e16;
      border: 1px solid #166534;
      color: #4ade80;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 20px;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      background: #4ade80;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* ── Stats bar ── */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
      padding: 24px 40px;
      background: #0f0f24;
      border-bottom: 1px solid #1e1e40;
    }

    .stat {
      background: #1a1a3e;
      border: 1px solid #2d2d5e;
      border-radius: 12px;
      padding: 16px 20px;
    }

    .stat-label { font-size: 12px; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; }
    .stat-value { font-size: 28px; font-weight: 700; color: #818cf8; margin-top: 4px; }
    .stat-sub { font-size: 12px; color: #475569; margin-top: 2px; }

    /* ── Filters ── */
    .filters {
      padding: 20px 40px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .filter-label { font-size: 13px; color: #64748b; }

    .filter-btn {
      padding: 7px 16px;
      border-radius: 20px;
      border: 1px solid #2d2d5e;
      background: transparent;
      color: #94a3b8;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn:hover, .filter-btn.active {
      background: #6366f1;
      border-color: #6366f1;
      color: white;
    }

    .search-box {
      margin-left: auto;
      padding: 8px 16px;
      background: #1a1a3e;
      border: 1px solid #2d2d5e;
      border-radius: 20px;
      color: #e2e8f0;
      font-size: 13px;
      width: 220px;
      outline: none;
    }

    .search-box::placeholder { color: #475569; }
    .search-box:focus { border-color: #6366f1; }

    /* ── Grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      padding: 0 40px 40px;
    }

    /* ── Card ── */
    .card {
      background: #1a1a3e;
      border: 1px solid #2d2d5e;
      border-radius: 16px;
      overflow: hidden;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: #6366f1;
      box-shadow: 0 8px 32px rgba(99,102,241,0.15);
    }

    .card-thumb {
      position: relative;
      background: #0d0d2e;
      aspect-ratio: 16/9;
      overflow: hidden;
    }

    .card-thumb iframe {
      width: 100%;
      height: 100%;
      border: none;
      pointer-events: none;
    }

    .card-thumb .no-thumb {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      background: linear-gradient(135deg, #1e1e50, #2d1b69);
    }

    .thumb-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .card:hover .thumb-overlay { opacity: 1; }

    .play-btn {
      width: 52px;
      height: 52px;
      background: rgba(99,102,241,0.9);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      text-decoration: none;
    }

    .card-body { padding: 16px; flex: 1; display: flex; flex-direction: column; gap: 10px; }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .badge-trending    { background: #1e3a5f; color: #60a5fa; border: 1px solid #1d4ed8; }
    .badge-educational { background: #1a3a2a; color: #4ade80; border: 1px solid #166534; }
    .badge-mythology   { background: #3b1a5f; color: #c084fc; border: 1px solid #7c3aed; }
    .badge-story       { background: #3b2a1a; color: #fb923c; border: 1px solid #c2410c; }
    .badge-sports      { background: #1a3a3b; color: #22d3ee; border: 1px solid #0e7490; }
    .badge-movie       { background: #3b1a2a; color: #f472b6; border: 1px solid #be185d; }
    .badge-failed      { background: #3b1111; color: #f87171; border: 1px solid #991b1b; }

    .card-date { font-size: 12px; color: #475569; }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      color: #e2e8f0;
      line-height: 1.4;
    }

    .card-topic { font-size: 12px; color: #64748b; }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: auto;
    }

    .tag {
      font-size: 11px;
      padding: 2px 8px;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 10px;
      color: #64748b;
    }

    .card-footer {
      padding: 12px 16px;
      border-top: 1px solid #2d2d5e;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .yt-link {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #f87171;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      transition: color 0.2s;
    }

    .yt-link:hover { color: #fca5a5; }

    .copy-btn {
      font-size: 12px;
      color: #475569;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .copy-btn:hover { background: #0f172a; color: #94a3b8; }

    /* ── Empty state ── */
    .empty {
      grid-column: 1/-1;
      text-align: center;
      padding: 80px 20px;
      color: #475569;
    }

    .empty-icon { font-size: 56px; margin-bottom: 16px; }
    .empty h3 { font-size: 18px; color: #64748b; margin-bottom: 8px; }
    .empty p { font-size: 14px; }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 20px;
      color: #334155;
      font-size: 12px;
      border-top: 1px solid #1e1e40;
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      header, .stats-bar, .filters, .grid { padding-left: 16px; padding-right: 16px; }
      .search-box { width: 100%; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">📡</div>
    <div>
      <h1>TrendPulse</h1>
      <p>Daily automated YouTube channel</p>
    </div>
  </div>
  <div class="header-right">
    <div class="live-badge">
      <span class="live-dot"></span>
      Auto-uploads daily
    </div>
  </div>
</header>

<div class="stats-bar" id="stats-bar">
  <div class="stat">
    <div class="stat-label">Total Videos</div>
    <div class="stat-value" id="stat-total">—</div>
    <div class="stat-sub">uploaded to YouTube</div>
  </div>
  <div class="stat">
    <div class="stat-label">Trending Videos</div>
    <div class="stat-value" id="stat-trending">—</div>
    <div class="stat-sub">news & trends</div>
  </div>
  <div class="stat">
    <div class="stat-label">Educational Videos</div>
    <div class="stat-value" id="stat-edu">—</div>
    <div class="stat-sub">explainers & courses</div>
  </div>
  <div class="stat">
    <div class="stat-label">Last Upload</div>
    <div class="stat-value" id="stat-last" style="font-size:18px;margin-top:6px;">—</div>
    <div class="stat-sub" id="stat-last-title"></div>
  </div>
</div>

<div class="filters">
  <span class="filter-label">Filter:</span>
  <button class="filter-btn active" onclick="filter('all', this)">All</button>
  <button class="filter-btn" onclick="filter('Indian Mythology', this)">🕉️ Mythology</button>
  <button class="filter-btn" onclick="filter('Sports', this)">🏆 Sports</button>
  <button class="filter-btn" onclick="filter('Tech', this)">💻 Tech</button>
  <button class="filter-btn" onclick="filter('Movies', this)">🎬 Movies</button>
  <button class="filter-btn" onclick="filter('Science', this)">🔬 Science</button>
  <button class="filter-btn" onclick="filter('History', this)">📜 History</button>
  <button class="filter-btn" onclick="filter('Trending', this)">📡 Trending</button>
  <button class="filter-btn" onclick="filter('failed', this)">❌ Failed</button>
  <input class="search-box" id="search" type="text" placeholder="Search videos…" oninput="render()" />
</div>

<div class="grid" id="grid"></div>

<footer>
  TrendPulse — fully automated, 100% copyright-free &nbsp;·&nbsp;
  <a href="https://github.com/yashwanthan00/TrendPulse" style="color:#6366f1;" target="_blank">GitHub</a>
</footer>

<script>
  let allVideos = [];
  let activeFilter = 'all';

  async function loadHistory() {
    try {
      const r = await fetch('history.json?t=' + Date.now());
      allVideos = await r.json();
    } catch(e) {
      allVideos = [];
    }
    updateStats();
    render();
  }

  function updateStats() {
    const success = allVideos.filter(v => v.status === 'success');
    document.getElementById('stat-total').textContent = success.length;
    document.getElementById('stat-trending').textContent = success.filter(v => v.mode === 'trending').length;
    document.getElementById('stat-edu').textContent = success.filter(v => v.mode === 'educational').length;
    if (allVideos.length > 0) {
      const last = allVideos[0];
      document.getElementById('stat-last').textContent = formatDate(last.date);
      document.getElementById('stat-last-title').textContent = truncate(last.title, 28);
    }
  }

  function filter(mode, btn) {
    activeFilter = mode;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  function render() {
    const query = document.getElementById('search').value.toLowerCase();
    let videos = allVideos;

    if (activeFilter !== 'all') {
      videos = videos.filter(v =>
        v.status === activeFilter ||
        v.mode === activeFilter ||
        (v.category || '') === activeFilter
      );
    }
    if (query) {
      videos = videos.filter(v =>
        v.title.toLowerCase().includes(query) ||
        v.topic.toLowerCase().includes(query) ||
        (v.tags || []).some(t => t.toLowerCase().includes(query))
      );
    }

    const grid = document.getElementById('grid');
    if (videos.length === 0) {
      grid.innerHTML = `
        <div class="empty">
          <div class="empty-icon">🎬</div>
          <h3>No videos yet</h3>
          <p>Videos will appear here after the first pipeline run.</p>
        </div>`;
      return;
    }

    grid.innerHTML = videos.map(v => cardHTML(v)).join('');
  }

  function cardHTML(v) {
    const isSuccess = v.status === 'success';
    const CATEGORY_ICONS = {
      'Indian Mythology': '🕉️', 'Sports': '🏆', 'Tech': '💻',
      'Movies': '🎬', 'Science': '🔬', 'History': '📜',
      'Business': '💼', 'Psychology': '🧠', 'Motivation': '🔥', 'Trending': '📡',
    };
    const modeColors = {
      'mythology': 'mythology', 'story': 'story', 'sports': 'sports',
      'movie': 'movie', 'educational': 'educational', 'trending': 'trending',
    };
    const cat = v.category || '';
    const icon = CATEGORY_ICONS[cat] || '📺';
    const badgeClass = v.status === 'failed' ? 'failed' : (modeColors[v.mode] || 'trending');
    const badgeLabel = cat || v.mode;
    const modeBadge = `<span class="badge badge-${badgeClass}">${icon} ${escHtml(badgeLabel)}</span>`;

    const thumb = v.video_id
      ? `<img src="https://img.youtube.com/vi/${v.video_id}/hqdefault.jpg" style="width:100%;height:100%;object-fit:cover;" loading="lazy" />`
      : `<div class="no-thumb">${v.mode === 'educational' ? '📚' : '📡'}</div>`;

    const overlay = v.youtube_url
      ? `<div class="thumb-overlay"><a class="play-btn" href="${v.youtube_url}" target="_blank">▶</a></div>`
      : '';

    const tags = (v.tags || []).slice(0, 4).map(t => `<span class="tag">#${t}</span>`).join('');

    const ytFooter = isSuccess && v.youtube_url
      ? `<a class="yt-link" href="${v.youtube_url}" target="_blank">
           <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2C0 8.1 0 12 0 12s0 3.9.5 5.8a3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1C24 15.9 24 12 24 12s0-3.9-.5-5.8zM9.8 15.5V8.5l6.3 3.5-6.3 3.5z"/></svg>
           Watch on YouTube
         </a>
         <button class="copy-btn" onclick="copyLink('${v.youtube_url}', this)">Copy link</button>`
      : `<span style="font-size:13px;color:#ef4444;">Pipeline failed</span>
         <span style="font-size:12px;color:#475569;">${(v.error||'').slice(0,40)}</span>`;

    return `
      <div class="card">
        <div class="card-thumb">
          ${thumb}
          ${overlay}
        </div>
        <div class="card-body">
          <div class="card-meta">
            ${modeBadge}
            <span class="card-date">${formatDate(v.date)}</span>
          </div>
          <div class="card-title">${escHtml(v.title)}</div>
          <div class="card-topic">Topic: ${escHtml(v.topic)}</div>
          <div class="card-tags">${tags}</div>
        </div>
        <div class="card-footer">${ytFooter}</div>
      </div>`;
  }

  function copyLink(url, btn) {
    navigator.clipboard.writeText(url).then(() => {
      btn.textContent = 'Copied!';
      setTimeout(() => btn.textContent = 'Copy link', 2000);
    });
  }

  function formatDate(d) {
    if (!d) return '';
    const date = new Date(d);
    return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function truncate(s, n) { return s && s.length > n ? s.slice(0, n) + '…' : s; }
  function escHtml(s) {
    return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  loadHistory();
</script>
</body>
</html>
